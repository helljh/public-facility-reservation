spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/public_facility}
    username: ${DB_USERNAME:public_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration-minutes: 30
  refresh-expiration-days: 14